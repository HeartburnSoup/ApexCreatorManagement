<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#171A22"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.55"/>
  <circle cx="1020" cy="90" r="240" fill="url(#glow1)"/>
  <circle cx="120" cy="560" r="200" fill="url(#glow2)"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="96" y="96" font-size="14" font-weight="700" fill="#38BDF8" letter-spacing="6">BOUTIQUE CREATOR MANAGEMENT</text>

    <text x="96" y="290" font-size="148" font-weight="800" fill="#FFFFFF" letter-spacing="-10">APEX</text>
    <text x="96" y="360" font-size="34" font-weight="600" fill="#FFFFFF" letter-spacing="2">CREATOR MANAGEMENT</text>

    <rect x="96" y="392" width="72" height="4" rx="2" fill="url(#accentLine)"/>

    <text x="96" y="468" font-size="30" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">You create the culture.</text>
    <text x="96" y="518" font-size="30" font-weight="600" fill="#38BDF8" letter-spacing="-0.5">We build the business.</text>

    <text x="96" y="578" font-size="18" font-weight="500" fill="#737373" letter-spacing="1">apexcreatormanagement.com</text>
  </g>

  <rect x="0" y="626" width="1200" height="4" fill="url(#accentLine)"/>
</svg>
